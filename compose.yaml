name: clouddeploy

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clouddeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clouddeploy_db}
      POSTGRES_USER: ${DB_USERNAME:-clouddeploy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    # Zero public port exposure: PostgreSQL is unreachable from host or external networks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clouddeploy_user} -d ${DB_NAME:-clouddeploy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Spring Boot Application Service
  # ============================================================================
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouddeploy-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clouddeploy_db}
      DB_USERNAME: ${DB_USERNAME:-clouddeploy_user}
      DB_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    # Zero host port mapping: All application traffic is reverse-proxied by Nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  # ============================================================================
  # 3. Nginx Reverse Proxy Service
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: clouddeploy-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: clouddeploy_postgres_data
  nginx_logs:
    name: clouddeploy_nginx_logs

# ==============================================================================
# Network Topology
# ==============================================================================
networks:
  frontend-net:
    name: clouddeploy_frontend_net
    driver: bridge
  backend-net:
    name: clouddeploy_backend_net
    driver: bridge
    internal: true
