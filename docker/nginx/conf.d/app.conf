# ==============================================================================
# Upstream Definition: Spring Boot Container
# ==============================================================================
upstream spring_backend {
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# Primary HTTP Server (Port 80)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # ==========================================================================
    # Structured JSON Error Responses for Clean Client Diagnostics
    # ==========================================================================
    error_page 403 /custom_403.json;
    location = /custom_403.json {
        internal;
        return 403 '{"timestamp":"$time_iso8601","status":403,"error":"Forbidden","message":"Access to this resource is prohibited."}\n';
        default_type application/json;
    }

    error_page 404 /custom_404.json;
    location = /custom_404.json {
        internal;
        return 404 '{"timestamp":"$time_iso8601","status":404,"error":"Not Found","message":"The requested endpoint does not exist."}\n';
        default_type application/json;
    }

    error_page 429 /custom_429.json;
    location = /custom_429.json {
        internal;
        return 429 '{"timestamp":"$time_iso8601","status":429,"error":"Too Many Requests","message":"Rate limit exceeded. Please retry after some time."}\n';
        default_type application/json;
    }

    error_page 502 503 504 /custom_50x.json;
    location = /custom_50x.json {
        internal;
        return 502 '{"timestamp":"$time_iso8601","status":502,"error":"Bad Gateway","message":"The upstream backend service is temporarily unavailable."}\n';
        default_type application/json;
    }

    # ==========================================================================
    # Public Health Probe: /health maps to Spring Boot's /actuator/health
    # Allows external ALB / load balancer probes without exposing /actuator
    # ==========================================================================
    location = /health {
        proxy_pass http://spring_backend/actuator/health;
        include /etc/nginx/snippets/proxy-params.conf;
        access_log off;
    }

    # ==========================================================================
    # SECURITY RULE: Block ALL Direct Public Access to Spring Boot Actuator
    # Prevents sensitive internal operational details, metrics, and configs
    # from leaking over the internet.
    # ==========================================================================
    location ^~ /actuator {
        return 403;
    }

    # ==========================================================================
    # Authentication Endpoints with Strict Brute-Force Rate Limiting (5 req/s)
    # ==========================================================================
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://spring_backend/api/v1/auth/;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ==========================================================================
    # Core REST API Endpoints with API Rate Limiting (20 req/s)
    # ==========================================================================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://spring_backend/api/;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ==========================================================================
    # Default Root Location (API Gateway Status Verification)
    # ==========================================================================
    location = / {
        return 200 '{"gateway":"CloudDeploy Nginx Reverse Proxy","status":"UP","api_version":"v1","docs":"/api/v1/tasks"}\n';
        default_type application/json;
    }

    # Catch-all unmatched locations return standard 404
    location / {
        return 404;
    }
}

