user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # High-Resolution Access Logging with Upstream Performance Metrics
    # ==========================================================================
    log_format custom_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time urt=$upstream_response_time '
                               'uct=$upstream_connect_time ustatus=$upstream_status';

    log_format json_analytics escape=json '{"time_local":"$time_local",'
                                          '"client_ip":"$remote_addr",'
                                          '"request":"$request",'
                                          '"status":$status,'
                                          '"body_bytes_sent":$body_bytes_sent,'
                                          '"request_time":$request_time,'
                                          '"upstream_response_time":"$upstream_response_time",'
                                          '"upstream_status":"$upstream_status",'
                                          '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log custom_combined;

    # ==========================================================================
    # Security & Information Exposure Controls
    # ==========================================================================
    server_tokens off; # Disables Nginx version output on error pages and headers

    # ==========================================================================
    # Socket & Network Optimizations
    # ==========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # ==========================================================================
    # Timeouts & Request Limits
    # ==========================================================================
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;

    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ==========================================================================
    # Gzip Compression
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    # ==========================================================================
    # Rate Limiting Zones (DDoS and Brute-Force Protection)
    # ==========================================================================
    # Auth endpoints: 5 requests per second per IP (for login & register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # General API endpoints: 20 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Return standard HTTP 429 Too Many Requests when rate limits are exceeded
    limit_req_status 429;

    # Include Virtual Host Configurations
    include /etc/nginx/conf.d/*.conf;
}
